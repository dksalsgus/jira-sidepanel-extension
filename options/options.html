<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira My Tickets — 설정</title>
  <style>
    :root {
      --jmt-bg-primary: #ffffff;
      --jmt-bg-secondary: #f5f5f7;
      --jmt-bg-tertiary: #ededf0;
      --jmt-bg-hover: rgba(0, 0, 0, 0.03);
      --jmt-text-primary: #1d1d1f;
      --jmt-text-secondary: #7a7a7a;
      --jmt-text-tertiary: #999999;
      --jmt-text-accent: #0066cc;
      --jmt-accent: #0066cc;
      --jmt-accent-hover: #0055b3;
      --jmt-accent-subtle: #e8f0fe;
      --jmt-surface-pearl: #fafafc;
      --jmt-border: #e0e0e0;
      --jmt-border-light: #f0f0f0;
      --jmt-border-focus: #0071e3;
      --jmt-danger: #d42b2b;
      --jmt-danger-subtle: #fef2f2;
      --jmt-danger-border: #fecaca;
      --jmt-success: #1a7a3a;
      --jmt-success-bg: #eafaf0;
      --jmt-success-border: #a7f3d0;
      --jmt-radius-sm: 8px;
      --jmt-radius-md: 11px;
      --jmt-radius-lg: 12px;
      --jmt-radius-xl: 18px;
      --jmt-radius-full: 9999px;
      --jmt-font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      --jmt-transition-fast: 0.12s ease;
      --jmt-transition-base: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--jmt-font-sans);
      font-size: 14px;
      color: var(--jmt-text-primary);
      background: var(--jmt-bg-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      background: var(--jmt-bg-primary);
      border-radius: 0;
      border: 1px solid var(--jmt-border-light);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--jmt-text-primary);
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: var(--jmt-text-secondary);
      margin-bottom: 28px;
      line-height: 1.47;
      font-size: 14px;
      letter-spacing: -0.15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--jmt-text-primary);
      font-size: 13px;
      letter-spacing: -0.1px;
    }

    .hint {
      font-size: 12px;
      color: var(--jmt-text-tertiary);
      margin-top: 4px;
      letter-spacing: -0.01px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0 20px;
      border: 1px solid var(--jmt-border);
      border-radius: var(--jmt-radius-full);
      font-size: 14px;
      color: var(--jmt-text-primary);
      transition: border-color var(--jmt-transition-fast), box-shadow var(--jmt-transition-fast);
      outline: none;
      font-family: var(--jmt-font-sans);
      height: 44px;
      letter-spacing: -0.15px;
    }

    input:focus {
      border-color: var(--jmt-border-focus);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn-save {
      flex: 1;
      padding: 0 22px;
      background: var(--jmt-accent);
      color: #fff;
      border: none;
      border-radius: var(--jmt-radius-full);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: background var(--jmt-transition-fast);
      font-family: var(--jmt-font-sans);
      height: 44px;
      letter-spacing: -0.15px;
    }

    .btn-save:hover {
      background: var(--jmt-accent-hover);
    }

    .btn-save:active {
      transform: scale(0.95);
    }

    .btn-save:focus-visible {
      outline: 2px solid var(--jmt-border-focus);
      outline-offset: 2px;
    }

    .btn-clear {
      padding: 0 20px;
      background: var(--jmt-bg-primary);
      color: var(--jmt-text-accent);
      border: 1px solid var(--jmt-accent);
      border-radius: var(--jmt-radius-full);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: background var(--jmt-transition-fast);
      font-family: var(--jmt-font-sans);
      height: 44px;
      letter-spacing: -0.15px;
    }

    .btn-clear:hover {
      background: var(--jmt-accent-subtle);
    }

    .btn-clear:active {
      transform: scale(0.95);
    }

    .btn-clear:focus-visible {
      outline: 2px solid var(--jmt-border-focus);
      outline-offset: 2px;
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--jmt-radius-md);
      font-size: 13px;
      display: none;
      letter-spacing: -0.1px;
      line-height: 1.43;
    }

    .status--success {
      background: var(--jmt-surface-pearl);
      color: var(--jmt-text-secondary);
      border: 1px solid var(--jmt-border-light);
    }

    .status--error {
      background: var(--jmt-danger-subtle);
      color: var(--jmt-danger);
      border: 1px solid var(--jmt-danger-border);
    }

    .status--info {
      background: var(--jmt-accent-subtle);
      color: var(--jmt-accent);
      border: 1px solid rgba(0, 102, 204, 0.15);
    }

    .api-token-link {
      color: var(--jmt-text-accent);
      text-decoration: none;
    }

    .api-token-link:hover {
      text-decoration: underline;
    }

    .form-group--checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--jmt-border-light);
      margin-top: 8px;
      min-height: 44px;
    }

    .form-group--checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--jmt-accent);
      flex-shrink: 0;
    }

    .form-group--checkbox label {
      margin: 0;
      font-weight: 400;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jira My Tickets 설정</h1>
    <p class="subtitle">Atlassian API Token으로 인증하여 내게 할당된 티켓을 확인하세요.</p>

    <form id="settings-form">
      <div class="form-group">
        <label for="domain">Jira 도메인</label>
        <input
          type="text"
          id="domain"
          placeholder="mycompany"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">예: mycompany → https://mycompany.atlassian.net</p>
      </div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="api-token">API Token</label>
        <input
          type="password"
          id="api-token"
          placeholder="API Token 입력"
          autocomplete="off"
        />
        <p class="hint">
          <a
            href="https://id.atlassian.com/manage-profile/security/api-tokens"
            target="_blank"
            class="api-token-link"
          >Atlassian API Token 발급 페이지</a>에서 토큰을 생성하세요.
        </p>
      </div>

      <div class="form-group form-group--checkbox">
        <input type="checkbox" id="auto-open" />
        <label for="auto-open">Jira 진입 시 패널 자동으로 열기</label>
      </div>

      <div class="form-group form-group--checkbox">
        <input type="checkbox" id="show-float-all-sites" />
        <label for="show-float-all-sites">모든 사이트에서 플로팅 버튼 표시</label>
      </div>

      <div class="actions">
        <button type="submit" class="btn-save">저장</button>
        <button type="button" class="btn-clear" id="btn-clear">초기화</button>
      </div>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
