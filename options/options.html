<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira My Tickets — 설정</title>
  <style>
    :root {
      --jmt-bg-primary: #ffffff;
      --jmt-bg-secondary: #f7f7f8;
      --jmt-bg-tertiary: #eeeeef;
      --jmt-bg-hover: #f3f3f5;
      --jmt-text-primary: #1a1a2e;
      --jmt-text-secondary: #6b7280;
      --jmt-text-tertiary: #9ca3af;
      --jmt-text-accent: #5b5fc7;
      --jmt-accent: #5b5fc7;
      --jmt-accent-hover: #4f53b5;
      --jmt-accent-subtle: #eef0ff;
      --jmt-border: #e5e5e6;
      --jmt-border-light: #f0f0f1;
      --jmt-border-focus: #5b5fc7;
      --jmt-danger: #ef4444;
      --jmt-danger-subtle: #fef2f2;
      --jmt-danger-border: #fecaca;
      --jmt-success: #10b981;
      --jmt-success-bg: #ecfdf5;
      --jmt-success-border: #a7f3d0;
      --jmt-shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --jmt-radius-sm: 4px;
      --jmt-radius-md: 6px;
      --jmt-radius-lg: 8px;
      --jmt-radius-xl: 12px;
      --jmt-font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      --jmt-transition-fast: 0.12s ease;
      --jmt-transition-base: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--jmt-font-sans);
      font-size: 14px;
      color: var(--jmt-text-primary);
      background: var(--jmt-bg-secondary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: var(--jmt-bg-primary);
      border-radius: var(--jmt-radius-xl);
      box-shadow: var(--jmt-shadow-sm);
      border: 1px solid var(--jmt-border-light);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--jmt-text-accent);
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: var(--jmt-text-secondary);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--jmt-text-primary);
    }

    .hint {
      font-size: 12px;
      color: var(--jmt-text-tertiary);
      margin-top: 4px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--jmt-border);
      border-radius: var(--jmt-radius-md);
      font-size: 14px;
      color: var(--jmt-text-primary);
      transition: border-color var(--jmt-transition-fast), box-shadow var(--jmt-transition-fast);
      outline: none;
      font-family: var(--jmt-font-sans);
    }

    input:focus {
      border-color: var(--jmt-border-focus);
      box-shadow: 0 0 0 3px rgba(91, 95, 199, 0.1);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn-save {
      flex: 1;
      padding: 10px;
      background: var(--jmt-accent);
      color: #fff;
      border: none;
      border-radius: var(--jmt-radius-lg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--jmt-transition-fast);
      font-family: var(--jmt-font-sans);
    }

    .btn-save:hover {
      background: var(--jmt-accent-hover);
    }

    .btn-clear {
      padding: 10px 20px;
      background: var(--jmt-bg-primary);
      color: var(--jmt-danger);
      border: 1px solid var(--jmt-danger-border);
      border-radius: var(--jmt-radius-lg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--jmt-transition-fast);
      font-family: var(--jmt-font-sans);
    }

    .btn-clear:hover {
      background: var(--jmt-danger-subtle);
    }

    .status {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--jmt-radius-md);
      font-size: 13px;
      display: none;
    }

    .status--success {
      background: var(--jmt-success-bg);
      color: #065f46;
      border: 1px solid var(--jmt-success-border);
    }

    .status--error {
      background: var(--jmt-danger-subtle);
      color: #991b1b;
      border: 1px solid var(--jmt-danger-border);
    }

    .status--info {
      background: var(--jmt-accent-subtle);
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }

    .api-token-link {
      color: var(--jmt-text-accent);
      text-decoration: none;
    }

    .api-token-link:hover {
      text-decoration: underline;
    }

    .form-group--checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--jmt-border-light);
      margin-top: 8px;
    }

    .form-group--checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--jmt-accent);
    }

    .form-group--checkbox label {
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jira My Tickets 설정</h1>
    <p class="subtitle">Atlassian API Token으로 인증하여 내게 할당된 티켓을 확인하세요.</p>

    <form id="settings-form">
      <div class="form-group">
        <label for="domain">Jira 도메인</label>
        <input
          type="text"
          id="domain"
          placeholder="mycompany"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">예: mycompany → https://mycompany.atlassian.net</p>
      </div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="api-token">API Token</label>
        <input
          type="password"
          id="api-token"
          placeholder="API Token 입력"
          autocomplete="off"
        />
        <p class="hint">
          <a
            href="https://id.atlassian.com/manage-profile/security/api-tokens"
            target="_blank"
            class="api-token-link"
          >Atlassian API Token 발급 페이지</a>에서 토큰을 생성하세요.
        </p>
      </div>

      <div class="form-group form-group--checkbox">
        <input type="checkbox" id="auto-open" />
        <label for="auto-open">Jira 진입 시 패널 자동으로 열기</label>
      </div>

      <div class="form-group form-group--checkbox">
        <input type="checkbox" id="show-float-all-sites" />
        <label for="show-float-all-sites">모든 사이트에서 플로팅 버튼 표시</label>
      </div>

      <div class="actions">
        <button type="submit" class="btn-save">저장</button>
        <button type="button" class="btn-clear" id="btn-clear">초기화</button>
      </div>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
